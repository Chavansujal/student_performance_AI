<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance AI</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- Background Animation -->

    <div class="bg-animation">

        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>

    </div>

    <!-- Main Container -->

    <div class="container">

        <!-- Logo -->

        <div class="logo">
            AI
        </div>

        <!-- Heading -->

        <h1>Student Performance AI</h1>

        <p class="subtitle">
            Predict academic performance using Machine Learning
        </p>

        <!-- Form -->

        <div class="form-grid">

            <div class="input-group">

                <label>Study Time</label>

                <input type="number" id="studytime" placeholder="Enter study time">

            </div>

            <div class="input-group">

                <label>Absences</label>

                <input type="number" id="absences" placeholder="Enter absences">

            </div>

            <div class="input-group">

                <label>G1 Marks</label>

                <input type="number" id="g1" placeholder="Enter G1 marks">

            </div>

            <div class="input-group">

                <label>G2 Marks</label>

                <input type="number" id="g2" placeholder="Enter G2 marks">

            </div>

        </div>

        <!-- Button -->

        <button onclick="predictMarks()">
            Predict Performance
        </button>

        <!-- Loader -->

        <div class="loader" id="loader"></div>

        <!-- Result -->

        <div class="result-box" id="resultBox">

            <div class="result-title">
                Predicted Final Score
            </div>

            <div class="score" id="score">
                0
            </div>

            <div class="message" id="message">

            </div>

        </div>

        <!-- Footer -->

        <div class="footer">
            Powered by FastAPI + Machine Learning
        </div>

    </div>

    <!-- JavaScript -->

    <script>

    async function predictMarks() {

        const studytime = document.getElementById("studytime").value;
        const absences = document.getElementById("absences").value;
        const g1 = document.getElementById("g1").value;
        const g2 = document.getElementById("g2").value;

        const loader = document.getElementById("loader");
        const resultBox = document.getElementById("resultBox");
        const score = document.getElementById("score");
        const message = document.getElementById("message");

        // Validation

        if (
            studytime === "" ||
            absences === "" ||
            g1 === "" ||
            g2 === ""
        ) {

            alert("Please fill all fields.");

            return;
        }

        // Show loader

        loader.style.display = "block";

        resultBox.style.display = "none";

        try {

            const response = await fetch(
                "https://student-performance-ai-qaby.onrender.com/predict",
                { 
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        studytime: parseInt(studytime),

                        absences: parseInt(absences),

                        g1: parseInt(g1),

                        g2: parseInt(g2)

                    })
                }
            );

            // Handle server error

            if (!response.ok) {

                throw new Error("Server Error");
            }

            const data = await response.json();

            // Hide loader

            loader.style.display = "none";

            // Show result box

            resultBox.style.display = "block";

            // Set score

            score.innerHTML = data.predicted_g3;

            // Performance messages

            let msg = "";

            if (data.predicted_g3 >= 16) {

                msg = `
                Excellent academic performance predicted.
                Student is likely to achieve high final grades.
                Keep maintaining consistency and discipline.
                `;

            }

            else if (data.predicted_g3 >= 10) {

                msg = `
                Good academic performance predicted.
                Slight improvement in study consistency
                can increase final marks further.
                `;

            }

            else {

                msg = `
                Low academic performance predicted.
                Increase study time, reduce absences,
                and focus on regular revision.
                `;
            }

            // Update message

            message.innerHTML = msg;

        }

        catch (error) {

            loader.style.display = "none";

            resultBox.style.display = "block";

            score.innerHTML = "Error";

            message.innerHTML =
                "Backend connection failed. Please check if Render backend is running properly.";

            console.log(error);
        }
    }

</script>

</body>

</html>
